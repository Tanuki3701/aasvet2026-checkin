<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>大會簽到系統 - 即時掃描</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>

      
    :root { --bg:#05070d; --panel:#0a0e1a; --line:#1f2b3d; --cyan:#00e5ff; --green:#39ff88; --yellow:#f4e04d; --mag:#ff2fd0; --red:#ff2f6d; --txt:#e6f1ff; --mut:#7f90a8; }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body { min-height:100vh; color:var(--txt); -webkit-font-smoothing:antialiased;
           font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Helvetica Neue',Arial,sans-serif;
           background-color:var(--bg);
           background-image:
             linear-gradient(rgba(0,229,255,.035) 1px, transparent 1px),
             linear-gradient(90deg, rgba(0,229,255,.035) 1px, transparent 1px),
             radial-gradient(circle at 12% 0%, rgba(0,229,255,.16), transparent 42%),
             radial-gradient(circle at 100% 30%, rgba(255,47,208,.10), transparent 40%),
             radial-gradient(circle at 0% 100%, rgba(124,58,237,.12), transparent 45%);
           background-size:32px 32px,32px 32px,auto,auto,auto; }
    body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:50;
           background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
    .mono { font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace; }
    .wrap { width:100%; max-width:460px; margin:0 auto; position:relative; z-index:2; }

    .cut { --c:var(--cyan); --k:14px; background:var(--c); padding:1px;
           clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k)); }
    .cut > .in { background:var(--panel); display:flow-root; clip-path:polygon(var(--k) 0,100% 0,100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,0 100%,0 var(--k)); }

    .tag { display:inline-flex; align-items:center; gap:6px; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); }
    .tag::before { content:''; width:6px; height:6px; background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
    .glow-line { height:2px; background:linear-gradient(90deg,transparent,var(--cyan),transparent); box-shadow:0 0 10px rgba(0,229,255,.7); }

    .kv { padding:6px 18px 12px; }
    .kv .r { display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:11px 0 11px 12px; border-bottom:1px dashed rgba(127,144,168,.25); position:relative; }
    .kv .r:last-child { border-bottom:0; }
    .kv .r::before { content:''; position:absolute; left:0; top:12px; bottom:12px; width:2px; background:var(--a,var(--c,#00e5ff)); box-shadow:0 0 8px var(--a,var(--c,#00e5ff)); }
    .kv .k { font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--mut); flex:0 0 auto; }
    .kv .v { font-size:15px; font-weight:600; text-align:right; word-break:break-word; color:var(--txt); }
    .kv .v.big { font-size:19px; font-weight:800; letter-spacing:.03em; text-shadow:0 0 12px rgba(255,255,255,.2); }
    .kv .v.id { color:var(--cyan); }
    .kv .v.mag { color:var(--mag); }
    .kv .v.grn { color:var(--green); }
    .kv .v.yel { color:var(--yellow); }

    .foot { padding:22px 0 18px; text-align:center; }
    .foot p { margin:8px 0 0; font-size:11px; letter-spacing:.14em; color:#5e6e85; }
    .foot .glow-line { width:70px; margin:0 auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes slide { 0%{margin-left:-40%} 100%{margin-left:100%} }
    @keyframes sweep { 0%,100%{ top:6% } 50%{ top:94% } }
    @media (prefers-reduced-motion: reduce) { .radar::after,.bar i,.qr .scan { animation:none !important; } }
  
      body { display:flex; flex-direction:column; }
      .s-head { padding:26px 22px 20px; text-align:center; }
      .s-head h1 { margin:10px 0 0; font-size:18px; line-height:1.5; font-weight:700; letter-spacing:.04em; text-shadow:0 0 14px rgba(0,229,255,.35); }
      .s-head .sub { margin-top:6px; font-size:11px; letter-spacing:.3em; color:var(--mut); }
      .s-main { padding:6px 16px 0; }
      .ctl { margin-bottom:16px; }
      .ctl .in { padding:16px 16px 18px; }
      .lbl { font-size:11px; letter-spacing:.2em; color:var(--cyan); text-transform:uppercase; margin-bottom:8px; display:block; }
      .sel { position:relative; }
      .sel select { width:100%; padding:13px 40px 13px 14px; font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--txt);
                    background:rgba(0,229,255,.06); border:1px solid rgba(0,229,255,.45); border-radius:0; appearance:none; -webkit-appearance:none; outline:none; }
      .sel select option { background:#0a0e1a; color:#e6f1ff; }
      .sel::after { content:''; position:absolute; right:16px; top:50%; margin-top:-6px; width:8px; height:8px; border-right:2px solid var(--cyan); border-bottom:2px solid var(--cyan); transform:rotate(45deg); pointer-events:none; }
      .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:14px; padding:17px; cursor:pointer;
             font-size:16px; font-weight:800; letter-spacing:.12em; color:#021018; background:var(--cyan);
             clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
             filter:drop-shadow(0 0 12px rgba(0,229,255,.55)); -webkit-tap-highlight-color:transparent; }
      .btn svg { width:22px; height:22px; stroke:#021018; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
      .btn:active { background:#7df3ff; }
      #qr-input-file { display:none; }
      button.btn { border:0; font-family:inherit; }
      .btn.alt { color:var(--cyan); background:transparent; border:1px solid rgba(0,229,255,.55); filter:none; clip-path:none; font-size:13px; padding:12px; margin-top:10px; letter-spacing:.14em; }
      .btn.stop { background:var(--red); color:#fff; }
      #live-wrap { display:none; margin-top:14px; border:1px solid var(--cyan); background:#000; position:relative; box-shadow:0 0 14px rgba(0,229,255,.35); }
      #live-wrap.on { display:block; }
      #live-reader { width:100%; min-height:200px; }
      #live-reader video { width:100% !important; display:block; }
      .live-hint { position:absolute; left:0; right:0; bottom:0; padding:6px; text-align:center; font-size:11px; letter-spacing:.2em; color:var(--cyan); background:rgba(2,16,24,.7); }
      .modetag { display:none; margin-top:10px; padding:9px 12px; text-align:center; font-size:12px; font-weight:800; letter-spacing:.18em; color:var(--mag); border:1px solid rgba(255,47,208,.55); background:rgba(255,47,208,.09); text-shadow:0 0 10px rgba(255,47,208,.5); }
      .modetag.on { display:block; }

      #result { --c:#1f2b3d; }
      .idle { padding:34px 20px 36px; text-align:center; color:var(--mut); font-size:13.5px; line-height:1.8; }
      .radar { width:84px; height:84px; margin:0 auto 14px; position:relative; border:1px solid rgba(0,229,255,.35); border-radius:50%; }
      .radar::before { content:''; position:absolute; inset:14px; border:1px dashed rgba(0,229,255,.3); border-radius:50%; }
      .radar::after { content:''; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg, rgba(0,229,255,.55), transparent 28%); animation:spin 2.4s linear infinite; }
      .loading { padding:34px 20px; text-align:center; color:var(--cyan); font-size:13px; line-height:1.9; letter-spacing:.08em; }
      .bar { height:3px; width:70%; margin:14px auto 0; background:rgba(0,229,255,.15); overflow:hidden; }
      .bar i { display:block; height:100%; width:40%; background:var(--cyan); box-shadow:0 0 10px var(--cyan); animation:slide 1.1s ease-in-out infinite; }

      .status { display:flex; gap:14px; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line); position:relative; background:linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, transparent), transparent 70%); }
      .status::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c); box-shadow:0 0 14px var(--c); }
      .ring { flex:0 0 46px; width:46px; height:46px; border:1.5px solid var(--c); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 14px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 10px color-mix(in srgb, var(--c) 25%, transparent); }
      .ring svg { width:24px; height:24px; stroke:var(--c); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
      .status .t { font-size:15px; font-weight:800; letter-spacing:.16em; color:var(--c); text-shadow:0 0 10px color-mix(in srgb, var(--c) 60%, transparent); }
      .status .m { font-size:13px; color:#b7c3d6; margin-top:3px; line-height:1.45; }
      .errmsg { white-space:pre-line; word-break:break-word; padding:16px 20px 20px; font-size:14px; color:#b7c3d6; line-height:1.6; }
      #reader-hidden { display:none; }
      .spacer { flex:1; }
    
    #live-wrap { display:block; margin-top:14px; border:1px solid var(--cyan); background:#000; position:relative; box-shadow:0 0 14px rgba(0,229,255,.35); min-height:120px; }
    #live-wrap.off { display:none; }
    #live-reader { width:100%; }
    #live-reader video { width:100% !important; display:block; }
    .live-hint { position:absolute; left:0; right:0; bottom:0; padding:6px; text-align:center; font-size:11px; letter-spacing:.2em; color:var(--cyan); background:rgba(2,16,24,.7); z-index:2; }
    button.btn { border:0; font-family:inherit; }
    .btn.stop { background:var(--red); color:#fff; }
    .setup { display:none; padding:20px; }
    .setup.on { display:block; }
    .setup label { display:block; margin:14px 0 6px; font-size:12px; letter-spacing:.14em; color:var(--cyan); }
    .setup input { width:100%; box-sizing:border-box; padding:13px 12px; font-size:15px; color:var(--txt); background:rgba(0,229,255,.05); border:1px solid rgba(0,229,255,.4); border-radius:0; font-family:inherit; }
    .gear { display:block; margin:14px auto 0; background:none; border:0; color:var(--mut); font-size:11px; letter-spacing:.2em; cursor:pointer; padding:6px; font-family:inherit; }
    .errmsg { white-space:pre-line; word-break:break-word; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="s-head">
      <span class="tag mono">Check-in Console</span>
      <h1 id="evt">大會簽到系統</h1>
      <div class="sub mono" id="sysline">SYSTEM // CONNECTING</div>
    </div>

    <div class="s-main">
      <div class="cut ctl" id="setupBox" style="display:none"><div class="in setup on">
        <div class="mono" style="color:#00e5ff;letter-spacing:.2em;font-size:12px;">STAFF LOGIN // 工作人員登入</div>
        <label for="apiIn" id="apiLbl">WEB APP 網址（以 /exec 結尾）</label>
        <input id="apiIn" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
        <label for="tokIn">個人碼 PERSONAL CODE</label>
        <input id="tokIn" type="text" placeholder="大會提供給你的 8 碼個人碼" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="btn" id="saveBtn" style="margin-top:20px">登入 LOGIN</button>
      </div></div>

      <div class="cut ctl" id="mainBox" style="display:none"><div class="in">
        <label class="lbl mono" for="daySelect">簽到日期 / DATE</label>
        <div class="sel"><select id="daySelect"></select></div>
        <div class="modetag mono" id="modeTag">BANQUET MODE // 晚宴簽到模式</div>
        <div id="live-wrap" class="off"><div id="live-reader"></div><div class="live-hint mono">LIVE SCAN // 對準 QR Code 即自動辨識</div></div>
        <button type="button" class="btn" id="liveBtn">
          <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
          <span id="liveBtnTxt">開啟即時掃描 LIVE SCAN</span>
        </button>
      </div></div>

      <div class="cut" id="result"><div class="in" id="result-in"></div></div>
      <button type="button" class="gear mono" id="resetBtn" style="display:none">[ 登出 / 換人 ]</button>
    </div>

    <div class="foot"><div class="glow-line"></div><p class="mono">System Developed by Luz</p></div>
  </div>

  <script>
    // ---------- 連線設定：網址 #api=...&k=... 可一次帶入（只存在這支手機的瀏覽器） ----------
    // 後端網址已內建（本來就公開在與會者信件中）；頁面內沒有任何通行碼，工作人員用自己的「個人碼」登入一次，手機會記住。
    const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwEyBeCLPKLklx78UJxxrtGXJsho0NpVYZ8hx0zo6SCaaloHW7PoFg0zI_Mi1eJ4fBJdw/exec';
    const LS = { api: 'ck_api', tok: 'ck_tok' };
    const getApi = () => lsGet(LS.api) || DEFAULT_API;
    const getTok = () => lsGet(LS.tok);
    function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch (_) {} }
    function readHash() {
      try {
        const h = new URLSearchParams(location.hash.replace(/^#/, ''));
        if (h.get('api')) lsSet(LS.api, h.get('api'));
        if (h.get('k')) lsSet(LS.tok, h.get('k'));
        if (h.get('api') || h.get('k')) history.replaceState(null, '', location.pathname + location.search);   // 立刻把通行碼從網址列移除
      } catch (_) {}
    }
    readHash();

    const $ = id => document.getElementById(id);
    const resultBox = $('result'), resultIn = $('result-in'), daySelect = $('daySelect'), modeTag = $('modeTag');
    let CFG = null, SKEW = 0, userTouched = false, resultIsIdle = true;

    // ---------- 共用顯示 ----------
    const IC = {
      ok:   '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
      warn: '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      err:  '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    };
    const COL = { ok:'#39ff88', warn:'#f4e04d', err:'#ff2f6d' };
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function setBorder(c) { resultBox.style.setProperty('--c', c); }
    function statusHtml(kind, title, msg) {
      return '<div class="status" style="--c:' + COL[kind] + '"><div class="ring">' + IC[kind] + '</div><div><div class="t mono">' + title + '</div>' + (msg ? '<div class="m">' + esc(msg) + '</div>' : '') + '</div></div>';
    }
    function kvHtml(a, c) {
      const rows = [
        ['姓名 Name', a.name, 'big', ''], ['報名編號 ID', a.id, 'id mono', ''], ['國家 Country', a.country, '', ''], ['地區 Region', a.region, '', ''],
        ['晚宴 Banquet', a.banquet, 'mag', '--a:#ff2fd0'], ['飲食 Diet', a.diet, 'grn', '--a:#39ff88'],
        ['Paper ID 1', a.paperId1, 'yel mono', '--a:#f4e04d'], ['Paper ID 2', a.paperId2, 'yel mono', '--a:#f4e04d'], ['時間 Time', a.time, 'mono', '']
      ];
      return '<div class="kv" style="--c:' + c + '">' + rows.filter(r => r[1]).map(r =>
        '<div class="r" style="' + r[3] + '"><div class="k mono">' + r[0] + '</div><div class="v ' + r[2] + '">' + esc(r[1]) + '</div></div>').join('') + '</div>';
    }
    function showIdle() {
      resultIsIdle = true; setBorder('#1f2b3d');
      resultIn.innerHTML = '<div class="idle"><div class="radar"></div><div class="mono" style="color:#00e5ff;letter-spacing:.2em;font-size:12px;">AWAITING INPUT</div>對準與會者的 QR Code<br>即可自動辨識並帶出資料</div>';
    }
    function showLoading(html) { resultIsIdle = false; setBorder('#00e5ff'); resultIn.innerHTML = '<div class="loading mono">' + html + '<div class="bar"><i></i></div></div>'; }
    function showError(title, msg) {
      resultIsIdle = false; setBorder(COL.err);
      resultIn.innerHTML = statusHtml('err', title, '') + (msg ? '<div class="errmsg">' + esc(msg) + '</div>' : '');
    }
    function renderResult(res) {
      if (!res || !res.attendee) { showError('SCAN ERROR', (res && res.message) || '未知錯誤'); return; }
      resultIsIdle = false;
      const a = res.attendee, bq = !!res.banquet;
      let kind = 'ok', title = bq ? 'BANQUET CHECK-IN OK' : 'CHECK-IN OK';
      if (res.already) { kind = 'warn'; title = bq ? 'BANQUET ALREADY CHECKED IN' : 'ALREADY CHECKED IN'; }
      if (!res.success) { kind = 'err'; title = res.denied ? 'NOT REGISTERED FOR BANQUET' : 'SCAN ERROR'; }
      setBorder(COL[kind]);
      resultIn.innerHTML = statusHtml(kind, title, res.message) + kvHtml(a, COL[kind]);
    }

    // ---------- 呼叫 Apps Script API ----------
    async function api(payload, timeoutMs) {
      const url = getApi(), token = getTok();
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs || 25000);
      try {
        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: token }, payload)), signal: ctl.signal, redirect: 'follow' });
        const j = await r.json();
        return j;
      } finally { clearTimeout(t); }
    }

    // ---------- 場次 / 晚宴自動預設 ----------
    function fillSessions() {
      daySelect.innerHTML = CFG.sessions.map(s => '<option value="' + esc(s.key) + '" data-banquet="' + (s.isBanquet ? 1 : 0) + '">' + esc(s.label) + '</option>').join('');
      if (CFG.defaultKey) daySelect.value = CFG.defaultKey;
      syncMode();
    }
    function syncMode() {
      const opt = daySelect.options[daySelect.selectedIndex];
      modeTag.classList.toggle('on', !!opt && opt.getAttribute('data-banquet') === '1');
      showIdle();
    }
    function autoSwitch() {
      if (!CFG || userTouched || !resultIsIdle) return;
      const now = Date.now() + SKEW;
      for (const a of CFG.auto) if (now >= a.from && now <= a.until && daySelect.value !== a.key) { daySelect.value = a.key; syncMode(); return; }
    }
    daySelect.addEventListener('change', () => { userTouched = true; syncMode(); });
    setInterval(autoSwitch, 15000);

    // ---------- 即時掃描 ----------
    const liveBtn = $('liveBtn'), liveBtnTxt = $('liveBtnTxt'), liveWrap = $('live-wrap');
    let starting = false, scanner = null, liveOn = false, busy = false, lastText = '', lastAt = 0, wake = null;

    async function handleDecoded(text) {
      const now = Date.now();
      if (busy) return;
      if (text === lastText && now - lastAt < 4000) return;
      lastText = text; lastAt = now; busy = true;
      try { if (navigator.vibrate) navigator.vibrate(80); } catch (_) {}
      showLoading('DECODED &gt; <span style="color:#f4e04d">' + esc(text) + '</span><br>SYNCING WITH SERVER…');
      try {
        const j = await api({ action: 'checkin', id: text, key: daySelect.value });
        if (!j.ok) {
          if (j.error === 'unauthorized') { lsDel(LS.tok); showError('UNAUTHORIZED', '個人碼不正確或已被停用，請重新整理頁面後重新登入。'); }
          else showError('SERVER ERROR', j.message || j.error || '伺服器回應異常');
        } else renderResult(j.result);
      } catch (e) {
        showError('CONNECTION ERROR', '無法連線至伺服器，請檢查網路後重新掃描。');
        lastText = '';   // 連線失敗時允許立刻重掃同一張
      }
      busy = false;
    }

    function newScanner() {
      return new Html5Qrcode('live-reader', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
    }
    async function startLive(auto) {
      if (liveOn || starting) return;
      starting = true;
      try { await startLive_(auto); } finally { starting = false; }
    }
    async function startLive_(auto) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showError('CAMERA UNAVAILABLE', '此瀏覽器不支援相機，或網址不是 https。'); return; }
      liveWrap.classList.remove('off');
      const cfg = { fps: 15, qrbox: (w, h) => { const m = Math.floor(Math.min(w, h) * 0.75); return { width: m, height: m }; } };
      let lastErr = null;
      const attempts = [
        async () => { scanner = newScanner(); await scanner.start({ facingMode: 'environment' }, cfg, handleDecoded, () => {}); },
        async () => { const cams = await Html5Qrcode.getCameras(); if (!cams.length) throw new Error('找不到相機'); let p = cams[cams.length - 1]; for (const c of cams) if (/back|rear|environment|後/i.test(c.label)) { p = c; break; } scanner = newScanner(); await scanner.start(p.id, cfg, handleDecoded, () => {}); }
      ];
      for (const f of attempts) {
        try { await f(); liveOn = true; liveBtn.classList.add('stop'); liveBtnTxt.textContent = '關閉相機 STOP'; keepAwake(); return; }
        catch (e) { lastErr = e; try { if (scanner) await scanner.stop(); } catch (_) {} try { if (scanner) scanner.clear(); } catch (_) {} scanner = null; }
      }
      liveWrap.classList.add('off');
      if (!auto || (lastErr && lastErr.name !== 'NotAllowedError')) showError('CAMERA UNAVAILABLE', '無法開啟相機：' + ((lastErr && (lastErr.name || '')) || '') + ' ' + ((lastErr && (lastErr.message || lastErr)) || '') + '\n請確認已允許瀏覽器使用相機（網址列左側的鎖頭／設定），再按「開啟即時掃描」。');
    }
    async function stopLive() {
      liveOn = false; liveBtn.classList.remove('stop'); liveBtnTxt.textContent = '開啟即時掃描 LIVE SCAN'; liveWrap.classList.add('off');
      const sc = scanner; scanner = null;
      if (sc) { try { await sc.stop(); } catch (_) {} try { sc.clear(); } catch (_) {} }
      try { if (wake) { await wake.release(); wake = null; } } catch (_) {}
    }
    async function keepAwake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (_) {} }   // 掃描時不讓螢幕自動關閉
    liveBtn.addEventListener('click', () => liveOn ? stopLive() : startLive(false));
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (liveOn) stopLive(); } });

    // ---------- 啟動流程 ----------
    function showSetup(msg) {
      $('setupBox').style.display = 'block'; $('mainBox').style.display = 'none';
      $('apiIn').value = getApi(); $('tokIn').value = '';
      const hideApi = !!DEFAULT_API; $('apiIn').style.display = hideApi ? 'none' : ''; $('apiLbl').style.display = hideApi ? 'none' : '';
      $('resetBtn').style.display = 'none';
      $('sysline').textContent = 'SYSTEM // LOGIN';
      resultIn.innerHTML = msg ? statusHtml('err', 'LOGIN FAILED', '') + '<div class="errmsg">' + esc(msg) + '</div>' : '<div class="idle">請輸入大會提供的個人碼登入</div>';
      setBorder(msg ? COL.err : '#1f2b3d');
    }
    async function boot() {
      if (!getApi() || !getTok()) { showSetup(''); return; }
      $('sysline').textContent = 'SYSTEM // CONNECTING';
      showLoading('CONNECTING…');
      try {
        const j = await api({ action: 'config' }, 20000);
        if (!j.ok) { if (j.error === 'unauthorized') { lsDel(LS.tok); showSetup('個人碼不正確，或此帳號已停用。'); } else showSetup(j.message || j.error || '伺服器回應異常'); return; }
        CFG = j.config; SKEW = CFG.nowMs - Date.now();
        $('evt').innerHTML = esc(CFG.eventZh) + '<br>大會簽到系統';
        $('sysline').textContent = 'STAFF // ' + (j.staff || '');
        $('resetBtn').style.display = 'block';
        $('setupBox').style.display = 'none'; $('mainBox').style.display = 'block';
        fillSessions();
        startLive(true);   // 開頁即自動開相機（若瀏覽器要求，先彈出相機授權）
      } catch (e) {
        showSetup('連不上伺服器。請確認網址正確，且 Apps Script 部署的「誰可以存取」為「所有人」。');
      }
    }
    $('saveBtn').addEventListener('click', () => {
      const a = DEFAULT_API || $('apiIn').value.trim(), t = $('tokIn').value.trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(a)) { showSetup('Web App 網址格式不正確（需以 https://script.google.com/ 開頭、/exec 結尾）。'); $('apiIn').value = a; return; }
      if (!t) { showSetup('請輸入個人碼。'); $('apiIn').value = a; return; }
      lsSet(LS.api, a); lsSet(LS.tok, t); boot();
    });
    $('resetBtn').addEventListener('click', async () => { await stopLive(); lsDel(LS.tok); if (!DEFAULT_API) lsDel(LS.api); showSetup(''); });
    window.addEventListener('hashchange', () => { readHash(); boot(); });
    boot();
  </script>
</body>
</html>
